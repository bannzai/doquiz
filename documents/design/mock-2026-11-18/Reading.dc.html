<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>読書中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500&display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 20px 24px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; color: #15181C; font-family: 'Noto Sans JP', sans-serif">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #C2410C"></span>
<span style="font-size: 15px; font-weight: 700; color: #C2410C">取り込み中</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A5260">読んでいる本</p>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.35">見本の本 記憶のしくみ入門</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border: 1px solid #D5D9E0; border-radius: 12px">
<span style="font-size: 13px; color: #4A5260">読んだ時間</span>
<span style="font-size: 32px; font-weight: 700; line-height: 1.2">18 分</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; background: #F1F4F6">
<p style="margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5">読書アプリに切り替えて読んでください</p>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3A414D">ページが変わるたびに本文だけを残します</p>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3A414D">画面の画像は保存しません</p>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #3A414D">本文はこの iPhone の外に送りません</p>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4A5260">読み終えたらここに戻ってください</p>
<a href="Quiz.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">読書を終える</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C"},"$preview":{"width":390,"height":844}}'>
/** 読書中の画面のモック。取り込み中であることの表示と、読書を終える入口を見せる */
class Component extends DCLogic {
/** テンプレートの穴に渡す値を返す。穴は強調の色だけ */
renderVals() {
// 既定の色: 白の地で文字にも面にも使えるコントラスト (白との比 6:1 以上) の深い緑
return { accent: this.props.accent ?? '#0F6B5C' };
}
}
</script>
</body>
</html>
