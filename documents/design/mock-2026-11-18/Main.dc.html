<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>本を選ぶ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500&display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; color: #15181C; font-family: 'Noto Sans JP', sans-serif">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.3">何を読みますか</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A5260">読む本を選ぶと読書を始められます</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="Book.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid #D5D9E0; border-radius: 12px; text-decoration: none; color: #15181C">
<span style="font-size: 18px; font-weight: 700; line-height: 1.4">見本の本 記憶のしくみ入門</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A5260">読書 4 回 ・ 最後に読んだのは昨日</span>
<span style="font-size: 14px; line-height: 1.5; color: {{accent}}; font-weight: 500">問い 18 問のうち 13 問が合っていました</span>
</a>
<a href="Book.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid #D5D9E0; border-radius: 12px; text-decoration: none; color: #15181C">
<span style="font-size: 18px; font-weight: 700; line-height: 1.4">見本の本 交渉の基本</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A5260">読書 1 回 ・ 最後に読んだのは 3 日前</span>
<span style="font-size: 14px; line-height: 1.5; color: {{accent}}; font-weight: 500">問い 4 問のうち 2 問が合っていました</span>
</a>
<a href="Book.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid #D5D9E0; border-radius: 12px; text-decoration: none; color: #15181C">
<span style="font-size: 18px; font-weight: 700; line-height: 1.4">見本の本 都市の歴史</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A5260">まだ読んでいません</span>
</a>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 52px; border: 1.5px solid {{accent}}; border-radius: 12px; background: #FFFFFF; color: {{accent}}; font-family: inherit; font-size: 17px; font-weight: 700">新しい本を登録する</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C"},"$preview":{"width":390,"height":844}}'>
/** 本を選ぶ画面のモック。登録済みの本の一覧と、新しい本の登録の入口を見せる */
class Component extends DCLogic {
/** テンプレートの穴に渡す値を返す。穴は強調の色だけ */
renderVals() {
// 既定の色: 白の地で文字にも面にも使えるコントラスト (白との比 6:1 以上) の深い緑
return { accent: this.props.accent ?? '#0F6B5C' };
}
}
</script>
</body>
</html>
