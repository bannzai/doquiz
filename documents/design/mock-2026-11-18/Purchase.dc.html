<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>購入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500&display=swap">
<style>
body{margin:0}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 20px 24px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; color: #15181C; font-family: 'Noto Sans JP', sans-serif">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.35">読んだ直後に確かめる</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4A5260">最初の 1 週間は無料で試せます</p>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.6">
<li>読んだ範囲からクイズを作ります</li>
<li>本文はこの iPhone の外に送りません</li>
<li>履歴でいつでも答え直せます</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 68px; padding: 12px 16px; border: 2px solid {{accent}}; border-radius: 12px; background: #EEF6F4; color: #15181C; font-family: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">年額</span><span style="font-size: 13px; color: #3A414D">1 週間無料 その後 1 年ごとに更新</span></span>
<span style="font-size: 18px; font-weight: 700">¥5,000</span>
</button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 68px; padding: 12px 16px; border: 1px solid #D5D9E0; border-radius: 12px; background: #FFFFFF; color: #15181C; font-family: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">月額</span><span style="font-size: 13px; color: #4A5260">1 週間無料 その後 1 か月ごとに更新</span></span>
<span style="font-size: 18px; font-weight: 700">¥500</span>
</button>
<button type="button" style="display: flex; justify-content: space-between; align-items: center; min-height: 68px; padding: 12px 16px; border: 1px solid #D5D9E0; border-radius: 12px; background: #FFFFFF; color: #15181C; font-family: inherit; text-align: left">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">買い切り</span><span style="font-size: 13px; color: #4A5260">1 回の支払いでずっと使えます</span></span>
<span style="font-size: 18px; font-weight: 700">¥20,000</span>
</button>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" style="height: 54px; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">1 週間無料で始める</button>
<p style="margin: 0; font-size: 12px; line-height: 1.7; color: #4A5260">無料の期間が終わると年額 ¥5,000 で自動で更新されます</p>
<p style="margin: 0; font-size: 12px; line-height: 1.7; color: #4A5260">いつでも解約できます</p>
<div style="display: flex; justify-content: space-between; font-size: 13px">
<a href="#restore" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; color: {{accent}}">購入を復元する</a>
<a href="#terms" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; color: {{accent}}">利用規約</a>
<a href="#privacy" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; color: {{accent}}">プライバシーポリシー</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C"},"$preview":{"width":390,"height":844}}'>
/** 購入の画面のモック。月額・年額・買い切りの 3 つと、月額と年額に付く 1 週間のトライアルを見せる。値段は owner が 2026-11-18 に決めた値 */
class Component extends DCLogic {
/** テンプレートの穴に渡す値を返す。穴は強調の色だけ */
renderVals() {
// 既定の色: 白の地で文字にも面にも使えるコントラスト (白との比 6:1 以上) の深い緑
return { accent: this.props.accent ?? '#0F6B5C' };
}
}
</script>
</body>
</html>
