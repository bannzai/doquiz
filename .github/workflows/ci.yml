name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR は新しい push で前の実行を止める。main への push は止めない
  # (続けてマージした時に、前のマージの commit の結果が残らなくなるため)。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read # checkout のみ

jobs:
  # Makefile が使うスクリプトのテスト。Xcode が要らないため Linux で動かす。
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test/test-select-physical-device.sh

  # public リポジトリのため macOS runner は無料。
  # iOS 27 の SDK が要るため、Xcode 27 が入っている xcode-27 の image を使う (macos-26 の image は Xcode 26 まで)。
  # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath tmp/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      # UI テストが添付した画面のスクリーンショットを取り出す (AGENTS.md「検証方法」の画面の確認に使う)。
      # Build が失敗した時は Test が動かずテスト結果が無いため、取り出さない
      # (失敗のログに、本当の原因ではないこの step の失敗を混ぜない)。
      - name: スクリーンショットを取り出す
        if: ${{ !cancelled() }}
        run: |
          if [ -d tmp/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path tmp/TestResults.xcresult --output-path tmp/screenshots
          fi
      - name: スクリーンショットを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
      - name: テスト結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: tmp/TestResults.xcresult
          if-no-files-found: ignore
