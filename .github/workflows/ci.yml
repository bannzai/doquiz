name: ci

concurrency:
  # PR は PR 番号でまとめ、新しい push で前の実行を止める。
  # main への push は commit ごとに別のグループにし、止めない・待たせない
  # (同じグループにすると、続けてマージした時に前の commit の実行が止められるか、
  # 待ち状態のまま次の実行に置き換えられて、その commit の結果が残らないため。
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs )。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read # checkout のみ

jobs:
  # Makefile が使うスクリプトのテスト。Xcode が要らないため Linux で動かす。
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test/test-select-physical-device.sh

  # public リポジトリのため macOS runner は無料。
  # iOS 27 の SDK が要るため、Xcode 27 が入っている xcode-27 の image を使う (macos-26 の image は Xcode 26 まで)。
  # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
  #
  # テストを 2 台の runner に分けて並べる。job の時間の 6〜7 割が UI テストで、1 台の中で 2 つの Simulator に分けて並べると
  # 逆に遅くなった (runner は 3 コア。run 44746443594 の計測。https://github.com/bannzai/doquiz/issues/76 ) ため、runner を分ける。
  # - separated-ui-tests: SEPARATED_UI_TEST_CLASSES の UI テスト (アプリの起動を温めるため、単体テストも先に流す。Test の step のコメント)
  # - other-tests: それ以外の全部 (単体テストと、残りの UI テスト。class を足すと、こちらで動く)
  build-and-test:
    runs-on: xcode-27
    strategy:
      # 片方が落ちても、もう片方の結果とスクリーンショットを残す。
      fail-fast: false
      matrix:
        tests:
          - separated-ui-tests
          - other-tests
    env:
      # 時間のかかる UI テストの class。2 台の所要時間が近くなるように選ぶ。
      SEPARATED_UI_TEST_CLASSES: QuizTests HistoryTests
      TESTS: ${{ matrix.tests }}
    # 45 分は、分けた後の job の実測 (run 44776580430 の 3 回で 18〜28 分。同じ時間帯の分ける前の job は 28〜39 分) のうち
    # 遅い方の 28 分に、UI テストが落ちた時の後始末の約 3.5 分 (run 44599776324) を足し、分ける前の job が遅い時間帯に
    # 50 分まで伸びた (run 44735398775) のと同じ割合で伸びても止まらないように余りを持たせた値。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      # iOS Simulator の SDK には ScreenCaptureKit が無く、画面の取り込みの実物 (Doquiz/ScreenCapture/ScreenCaptureKitScreenCapture.swift) は
      # 実機向けのビルドでしかコンパイルされないため、実機向けにもビルドする (署名はしない)。
      - name: Build (実機向け)
        if: ${{ matrix.tests == 'separated-ui-tests' }}
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          set -o pipefail
          # separated-ui-tests でも単体テストを先に流す。単体テストはテストの土台にアプリを Simulator で起動するため、
          # UI テストの最初の起動が 2 回目の起動になる。単体テストを流さないと最初の UI テストがアプリの初めての起動になり、
          # 起動に 8〜47 秒かかって、1 回は約 149 秒で「Timed out while launching application」で落ちた
          # (UI テストの前に単体テストを流す job は 2〜25 秒。run 44776580430・44797294988 のログ)。
          selection=()
          if [ "$TESTS" = separated-ui-tests ]; then
            selection+=("-only-testing:DoquizTests")
          fi
          for class in $SEPARATED_UI_TEST_CLASSES; do
            if [ "$TESTS" = separated-ui-tests ]; then
              selection+=("-only-testing:DoquizUITests/$class")
            else
              selection+=("-skip-testing:DoquizUITests/$class")
            fi
          done
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            "${selection[@]}" \
            -resultBundlePath tmp/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      # UI テストが添付した画面のスクリーンショットを取り出す (AGENTS.md「検証方法」の画面の確認に使う)。
      # Build が失敗した時は Test が動かずテスト結果が無いため、取り出さない
      # (失敗のログに、本当の原因ではないこの step の失敗を混ぜない)。
      - name: スクリーンショットを取り出す
        if: ${{ !cancelled() }}
        run: |
          if [ -d tmp/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path tmp/TestResults.xcresult --output-path tmp/screenshots
          fi
      - name: スクリーンショットを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.tests }}
          path: tmp/screenshots
          if-no-files-found: ignore
      - name: テスト結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.tests }}
          path: tmp/TestResults.xcresult
          if-no-files-found: ignore
