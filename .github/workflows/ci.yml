name: ci

concurrency:
  # PR は PR 番号でまとめ、新しい push で前の実行を止める。
  # main への push は commit ごとに別のグループにし、止めない・待たせない
  # (同じグループにすると、続けてマージした時に前の commit の実行が止められるか、
  # 待ち状態のまま次の実行に置き換えられて、その commit の結果が残らないため。
  # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs )。
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read # checkout のみ

jobs:
  # Makefile が使うスクリプトのテスト。Xcode が要らないため Linux で動かす。
  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/test/test-select-physical-device.sh
      - run: bash scripts/test/test-write-secrets-xcconfig.sh

  # public リポジトリのため macOS runner は無料。
  # iOS 27 の SDK が要るため、Xcode 27 が入っている xcode-27 の image を使う (macos-26 の image は Xcode 26 まで)。
  # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
  build-and-test:
    runs-on: xcode-27
    # 45 分は、RevenueCat の SDK と購入の UI テスト 2 件を足した実行 (run 44676960359) が 30 分の上限で止まった実測から選んだ。
    # その実行は Build の 2 つの step に約 4 分 (SDK のビルドで、足す前の約 1 分 15 秒から延びた)、Test の step に 26 分かかった時点で、
    # UI テストを 4 件残して止まった (落ちたテストは無い。残りは 1 件 15〜30 秒)。合わせて約 33 分に、runner が遅い時の余りを持たせた。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      # RevenueCat の公開 SDK キーを、Doquiz.xcconfig が読み込む Secrets.xcconfig に書き出す。
      # secret が無い時 (登録前・fork からの PR) は空の値になり、アプリは RevenueCat の SDK を初期化しない
      # (テストは偽の購入で動かすため、キーが無くても通る)。
      - name: RevenueCat の公開 SDK キーを書き出す
        env:
          REVENUECAT_PUBLIC_API_KEY_IOS: ${{ secrets.REVENUECAT_PUBLIC_API_KEY_IOS }}
        run: bash scripts/write-secrets-xcconfig.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      # iOS Simulator の SDK には ScreenCaptureKit が無く、画面の取り込みの実物 (Doquiz/ScreenCapture/ScreenCaptureKitScreenCapture.swift) は
      # 実機向けのビルドでしかコンパイルされないため、実機向けにもビルドする (署名はしない)。
      - name: Build (実機向け)
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Doquiz.xcodeproj -scheme Doquiz \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath tmp/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      # UI テストが添付した画面のスクリーンショットを取り出す (AGENTS.md「検証方法」の画面の確認に使う)。
      # Build が失敗した時は Test が動かずテスト結果が無いため、取り出さない
      # (失敗のログに、本当の原因ではないこの step の失敗を混ぜない)。
      - name: スクリーンショットを取り出す
        if: ${{ !cancelled() }}
        run: |
          if [ -d tmp/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path tmp/TestResults.xcresult --output-path tmp/screenshots
          fi
      - name: スクリーンショットを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
      - name: テスト結果を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: tmp/TestResults.xcresult
          if-no-files-found: ignore
