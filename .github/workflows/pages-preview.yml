name: Pages Preview

# docs/ (GitHub Pages で配信する紹介のページと法務の文書) を、公開と同じ Jekyll でビルドし、
# 外部マシンのブラウザで開いた画像を artifact に残す。agent は owner の作業用の Mac でブラウザを
# 起動しない (documents/adr/0001-verify-on-external-machines.md) ため、見た目はこの画像で確かめる
on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read # checkout のみ

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub Pages と同じ Jekyll で docs/ をビルドする
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: 紹介のページと 3 つの文書が HTML になっていることを確かめる
        run: ls -l _site/index.html _site/Terms-ja.html _site/PrivacyPolicy-ja.html _site/SpecifiedCommercialTransactionAct-ja.html _site/og.png
      - name: 日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: ブラウザを入れる
        run: npx --yes playwright@1.65.1 install --with-deps chromium
      - name: スマートフォンの幅と PC の幅で開いた画像を撮る
        run: |
          mkdir -p screenshots
          python3 -m http.server 8000 --directory _site >/dev/null 2>&1 &
          sleep 2
          for page in index Terms-ja PrivacyPolicy-ja SpecifiedCommercialTransactionAct-ja; do
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=390,844 "http://localhost:8000/${page}.html" "screenshots/${page}-mobile.png"
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=1280,800 "http://localhost:8000/${page}.html" "screenshots/${page}-desktop.png"
          done
      - name: 画像を artifact に残す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-screenshots
          path: screenshots
          if-no-files-found: error
