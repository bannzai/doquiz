name: Pages Preview

# docs/ (GitHub Pages で配信する紹介のページと法務の文書) を、公開と同じ Jekyll でビルドし、
# 外部マシンのブラウザで開いた画像を artifact に残す。agent は owner の作業用の Mac でブラウザを
# 起動しない (documents/adr/0001-verify-on-external-machines.md) ため、見た目はこの画像で確かめる。
# documents/design/ (owner に見せる資料の HTML) も、同じ理由で同じブラウザで開いた画像を残す
on:
  pull_request:
    paths:
      - "docs/**"
      - "documents/design/**"
      - ".github/workflows/pages-preview.yml"
      - ".github/scripts/check-design-motion.cjs"
  workflow_dispatch:

permissions:
  contents: read # checkout のみ

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub Pages と同じ Jekyll で docs/ をビルドする
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: 紹介のページと 3 つの文書が HTML になっていることを確かめる
        run: ls -l _site/index.html _site/Terms-ja.html _site/PrivacyPolicy-ja.html _site/SpecifiedCommercialTransactionAct-ja.html _site/og.png
      - name: 日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: ブラウザを入れる
        run: npx --yes playwright@1.65.1 install --with-deps chromium
      - name: スマートフォンの幅と PC の幅で開いた画像を撮る
        run: |
          mkdir -p screenshots
          python3 -m http.server 8000 --directory _site >/dev/null 2>&1 &
          sleep 2
          for page in index Terms-ja PrivacyPolicy-ja SpecifiedCommercialTransactionAct-ja; do
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=390,844 "http://localhost:8000/${page}.html" "screenshots/${page}-mobile.png"
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=1280,800 "http://localhost:8000/${page}.html" "screenshots/${page}-desktop.png"
          done
      - name: documents/design の資料をスマートフォンの幅と PC の幅で開いた画像を撮る
        run: |
          python3 -m http.server 8001 --directory documents/design >/dev/null 2>&1 &
          sleep 2
          for directory in documents/design/*/; do
            name="$(basename "$directory")"
            # 3 秒待つのは、資料の中の動き (長いもので 2.5 秒ほど) が終わった後の状態を撮るため
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=390,844 --wait-for-timeout=3000 "http://localhost:8001/${name}/index.html" "screenshots/design-${name}-mobile.png"
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=1360,900 --wait-for-timeout=3000 "http://localhost:8001/${name}/index.html" "screenshots/design-${name}-desktop.png"
          done
      - name: 見た目の案の資料の動きを確かめ 動きの途中の画像を撮る
        run: |
          # スクリプトが require する playwright を、リポジトリの外に入れる (ブラウザは上の step で入れたものを使う)
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright@1.65.1
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" node .github/scripts/check-design-motion.cjs http://localhost:8001/quiz-look-2026-11-25/index.html screenshots design-quiz-look-2026-11-25
      - name: 画像を artifact に残す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-screenshots
          path: screenshots
          if-no-files-found: error

  # documents/design の資料は owner が Mac で開いて見る。資料が指定する macOS の書体 (ヒラギノ) は
  # Linux の runner に無いため、書体を含めた見た目は macOS の runner で開いた画像で確かめる
  design-screenshot-macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ブラウザを入れる
        run: npx --yes playwright@1.65.1 install chromium
      - name: documents/design の資料を PC の幅で開いた画像を撮る
        run: |
          mkdir -p screenshots
          python3 -m http.server 8001 --directory documents/design >/dev/null 2>&1 &
          sleep 2
          for directory in documents/design/*/; do
            name="$(basename "$directory")"
            npx --yes playwright@1.65.1 screenshot --full-page --viewport-size=1360,900 --wait-for-timeout=3000 "http://localhost:8001/${name}/index.html" "screenshots/design-${name}-desktop-macos.png"
          done
      - name: 画像を artifact に残す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-screenshots-macos
          path: screenshots
          if-no-files-found: error
